# Variante statique (Dockerfile.static) : sert l'export Next (out/) en non-root sur le port 8080.
worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server_tokens off;
	sendfile on;
	access_log /dev/stdout;
	error_log /dev/stderr warn;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	server {
		listen 8080;
		root /usr/share/nginx/html;

		# Mêmes en-têtes que next.config.js (variante standalone).
		include /etc/nginx/security-headers.conf;

		location /_next/static/ {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}

		location / {
			try_files $uri $uri.html $uri/ =404;
		}

		# Comme le serveur Next : la page 404 n'est jamais servie avec un statut 200.
		location = /404 {
			return 404;
		}

		location = /404.html {
			internal;
		}

		error_page 404 /404.html;
	}
}
